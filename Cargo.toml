[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/ingress",
    "crates/core",
    "crates/strategy",
    "crates/solana-program",
    "crates/jito-handler",
    "crates/risk-oracle",
    "crates/safety",
    "crates/bot",
]

[workspace.dependencies]
# === Core Runtime ===
tokio = { version = "1", features = ["full"] }

# === Solana Ecosystem ===
solana-sdk = "2.1"
solana-client = "2.1"
jito-sdk = { version = "0.2", features = ["mainnet"] }

# === Serialization ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# === Numeric & Math ===
rust_decimal = { version = "1.35", features = ["maths", "serde-float"] }
num-traits = "0.2"

# === Hashing & Crypto ===
sha2 = "0.10"
blake3 = "1.5"
rustc-hash = "2.0"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# === Logging & Observability ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = { version = "0.13", features = ["process"] }

# === Error Handling ===
thiserror = "1.0"
anyhow = "1.0"

# === Utilities ===
bytes = "1.0"
bytemuck = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.8", features = ["small_rng"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# === HTTP & WebSocket ===
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"   # Better debugging experience on macOS/Linux

# Optional: Faster incremental builds during development
[profile.dev.package."*"]
opt-level = 3   # Optimize dependencies even in dev mode (speeds up tests)
